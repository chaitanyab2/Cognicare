databases:
  - name: cognicare-db
    databaseName: cognicare
    user: cognicare
    plan: free

services:
  - type: web
    name: cognicare
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn cognicare.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60"
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: cognicare-db
          property: connectionString
